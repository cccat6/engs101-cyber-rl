[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engs101-cyber-rl"
version = "0.2.0"
description = "Student starter, local cyber RL environment, and submission contract for ENGS 101."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "torch>=2.1,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyberrl_eval = ["teacher_baseline/*.pt"]
